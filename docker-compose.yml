  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    hostname: prowlarr
    volumes:
      - ${ARRPATH}Prowlarr/config:/config
      - ${ARRPATH}Prowlarr/backup:/data/Backup
      - ${ARRPATH}Downloads:/downloads
    ports:
      - 9696:9696
    restart: unless-stopped
    labels:
       - "homepage.group=Media"
       - "homepage.name=prowlarr3"
       - "homepage.icon=prowlarr.png"
       - "homepage.href=http://192.168.68.110:9696"
       - "homepage.description= Prowlarr on 110"
       - "homepage.widget.type=prowlarr"
       - "homepage.widget.url=http://192.168.68.110:9696"
       - "traefik.enable=true"
       - "traefik.http.routers.prowlarr.entrypoints=http"
       - "traefik.http.routers.prowlarr.rule=Host(`prowlarr3.asbblog.com`)"
       - "traefik.http.routers.prowlarr.middlewares=https-redirect"
       - "traefik.http.routers.prowlarr-secure.entrypoints=https"
       - "traefik.http.routers.prowlarr-secure.rule=Host(`prowlarr3.asbblog.com`)"
       - "traefik.http.routers.prowlarr-secure.tls=true"
       - "traefik.http.routers.prowlarr-secure.service=prowlarr"
       - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
       - "traefik.docker.network=arrstack"
    env_file:
      - '.env'
      
