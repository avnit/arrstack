        - "traefik.http.routers.huntarr.entrypoints=http"
        - "traefik.http.routers.huntarr.rule=Host(`huntarr.asbblog.com`)"
        - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.huntarr.middlewares=https-redirect"
        - "traefik.http.routers.huntarr-secure.entrypoints=https"
        - "traefik.http.routers.huntarr-secure.rule=Host(`huntarr.asbblog.com`)"
        - "traefik.http.routers.huntarr-secure.tls=true"
        - "traefik.http.routers.huntarr-secure.service=huntarr"
        - "traefik.http.services.huntarr.loadbalancer.server.port=8181"
        - "traefik.docker.network=arrstack"
########################
# Caddy
# ########################
  caddy:
    container_name: caddy
    image: ghcr.io/hotio/caddy:latest
    platform: linux/amd64
    ports:
      - 8081:8081
      - 8443:8443
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - CUSTOM_BUILD
      - TZ=Etc/UTC
    volumes:
      - ${ARRPATH}caddy/config:/config
    networks:
      - arrstack
#######################################
# Treafik
#######################################
  traefik:
    image: traefik:latest
    container_name: traefik
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - arrstack
    ports:
      - 9080:80
      - 9443:443
    environment:
      - CF_API_EMAIL=${CF_API_EMAIL}
      - CF_API_KEY=${CF_API_KEY}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${ARRPATH}traefik/data/traefik.yml:/traefik.yml:ro
      - ${ARRPATH}traefik/data/acme.json:/acme.json
      - ${ARRPATH}treafik/data/config.yml:/config.yml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-http.entrypoints=web"
      - "traefik.http.routers.traefik-http.rule=Host(`traefik.asbblog.com`)"
      - "traefik.http.routers.traefik-http.middlewares=traefik-redirect-to-https"
      - "traefik.http.routers.traefik-secure.entrypoints=websecure"
      - "traefik.http.routers.traefik-secure.rule=Host(`traefik.asbblog.com`)"
      - "traefik.http.routers.traefik-secure.middlewares=traefik-auth"
      - "traefik.http.routers.traefik-secure.tls=true"
      - "traefik.http.routers.traefik-secure.tls.certresolver=cloudflare"
      - "traefik.http.routers.traefik-secure.tls.domains[0].main=asbblog.com"
      - "traefik.http.routers.traefik-secure.tls.domains[0].sans=*.asbblog.com"
      - "traefik.http.routers.traefik-secure.service=api@internal"
      - "traefik.http.middlewares.traefik-redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=admin:golD123@"
networks:
  arrstack:
    external: true
    name: arrstack