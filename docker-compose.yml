################
# configarr
##############
  configarr:
    image: ghcr.io/raydak-labs/configarr:latest
    container_name: configarr
    user: 1000:1000 # Optional, defaults to root:root
    environment:
      - TZ=Etc/UTC
    volumes:
      - ${ARRPATH}configarr/config:/app/config # Contains the config.yml and secrets.yml
      - ${ARRPATH}configarr/dockerrepos:/app/repos # Cache repositories
      - ${ARRPATH}configarr/custom/cfs:/app/cfs # Optional if custom formats locally provided
      - ${ARRPATH}configarr/custom/templates:/app/templates # Optional if custom templates
    restart: unless-stopped # optional make sure this is set to no or removed. Default is no
    networks:
      - arrstack
########################
# Autoheal
########################
  autoheal:
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 7
    image: willfarrell/autoheal:latest
    network_mode: none
    restart: always
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock 
